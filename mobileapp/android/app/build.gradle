apply plugin: 'com.android.application'

def releaseKeyPropertiesFile = rootProject.file('release-key.properties')
def releaseKeyProperties = new Properties()
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningProperties = requiredSigningProperties.findAll {
        !releaseKeyProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("release-key.properties is missing: ${missingSigningProperties.join(', ')}")
    }
    if (!rootProject.file(releaseKeyProperties.getProperty('storeFile')).isFile()) {
        throw new GradleException('The storeFile in release-key.properties does not point to an existing keystore. Use forward slashes for Windows paths.')
    }
}

android {
    namespace "com.vizhaone.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vizhaone.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Leave signing unset when no local keystore is configured, so Android
        // Studio can supply signing credentials through its signed bundle wizard.
        if (releaseKeyPropertiesFile.exists()) {
            release {
                storeFile rootProject.file(releaseKeyProperties.getProperty('storeFile'))
                storePassword releaseKeyProperties.getProperty('storePassword')
                keyAlias releaseKeyProperties.getProperty('keyAlias')
                keyPassword releaseKeyProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail before compilation instead of creating an unsigned Play Store artifact.
def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Checks that release signing credentials have been supplied.'
    doLast {
        if (!releaseKeyPropertiesFile.exists() && !project.hasProperty('android.injected.signing.store.file')) {
            throw new GradleException('Release signing is not configured. Copy android/release-key.properties.example to android/release-key.properties and enter your EXISTING upload keystore details, or use Android Studio > Build > Generate Signed Bundle / APK. Do not generate a replacement key for an already published app.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn(validateReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
